<style>

:root[data-theme="dark"]{--bg:#0a1228;--sf:#111c3a;--ink:#e7edfb;--mut:#93a4c8;--ln:#233358;--ac:#5b9bff;--ac2:#17284f;--onac:#06142e;--ok:#4ade9f;--wn:#fbbf5a;--er:#ff8a8a;--nav1:#060c1f;--nav2:#0d1a3d;--sh:0 8px 28px rgba(0,0,0,.35)}

/* ===================== Theme v2 – modern blue / teal, light sidebar ===================== */
:root{--bg:#f1f5fb;--sf:#fff;--ink:#0b1b3a;--mut:#5b6b8c;--ln:#e0e8f5;--ac:#1f5fe0;--ac2:#e7f0ff;--teal:#0fa3a3;--side:#fff;--side-ink:#3a4a69;--side-on:#e8f0ff;--sh:0 1px 2px rgba(11,27,58,.05),0 12px 30px rgba(31,95,224,.08)}

function flowTable(r,ev,acts){const p=r.fi.filter(f=>f.g!="A");return p.length?`<div class="tw"><table><tr><th>ID</th><th>ข้อ</th><th>สิ่งที่พบ</th><th>เกรด</th><th>CAR / ขั้นตอนการแก้ไข</th>${acts?"<th></th>":""}</tr>${p.map(f=>{const c=f.carId&&rec(f.carId);return `<tr><td class="mono">${f.id}</td><td class="mono">${h(f.sub||f.cl)}</td><td>${h(f.de)}${ev&&f.ev?`<div class="mut" style="font-size:13px">หลักฐาน: ${h(f.ev)}</div>`:""}${ev&&(f.files||[]).length?`<div class="mut" style="font-size:13px">ไฟล์แนบ: ${f.files.map(x=>`<a href="/_blob/${x.id}" target="_blank" rel="noopener">${h(x.name)}</a>`).join(", ")}</div>`:""}</td><td>${gtag(f)}</td><td>${c?`<a class="mono" href="#/capa/${c.id}">${h(c.no)}</a> ${tag(c.status)}<div class="mut" style="font-size:13px">ขั้นที่ ${WF.capa.indexOf(c.status)+1}/7${c.v.resp_due&&WF.capa.indexOf(c.status)<=2?" · ตอบภายใน "+date(c.v.resp_due):""}</div>`:'<span class="mut">รอออก CAR</span>'}</td>${acts?`<td style="font-size:13px;white-space:nowrap">${!c&&canCar()?`<a href="#" onclick="carFinding('${r.id}','${f.id}');return false">ออก CAR</a> · `:""}${!c?`<a href="#" onclick="grade('${r.id}','${f.id}');return false">ปรับเกรด</a>`:""}</td>`:""}</tr>`}).join("")}</table></div>`:'<p class="mut">ไม่มีประเด็น B / N/C</p>'}
const CQ={"4.1":[["4.1.1","ห้องปฏิบัติการต้องดำเนินการอย่างเป็นกลางและมีโครงสร้างและการจัดการเพื่อรักษาความเป็นกลาง"],["4.1.2","ผู้บริหารของห้องปฏิบัติการต้องแสดงถึงความมุ่งมั่นต่อความเป็นกลาง"],["4.1.3","ห้องปฏิบัติการต้องรับผิดชอบต่อความเป็นกลางของกิจกรรมของห้องปฏิบัติการและไม่ให้มีความกดดันทางการค้า การเงินหรืออื่นๆ ที่จะส่งผลกระทบต่อความเป็นกลาง"],["4.1.4","ห้องปฏิบัติการต้องชี้บ่งถึงความเสี่ยงต่อความเป็นกลาง ซึ่งรวมถึงความเสี่ยงที่เกิดจากกิจกรรมของห้องปฏิบัติการหรือจากความสัมพันธ์ใดๆทั้งในระดับหน่วยงานและระดับบุคคล"],["4.1.5","หากมีการระบุความเสี่ยงต่อความเป็นกลาง ห้องปฏิบัติการต้องสามารถแสดงให้เห็นถึงวิธีการกำจัดหรือลดความเสี่ยงดังกล่าว"]],"4.2":[["4.2.1","ห้องปฏิบัติการต้องรับผิดชอบในการจัดการข้อมูลทั้งหมดที่ได้รับ หรือข้อมูลที่เกิดจากการดำเนินกิจกรรมของห้องปฏิบัติการ ห้องปฏิบัติการต้องแจ้งให้ลูกค้าทราบล่วงหน้าสำหรับข้อมูลที่จะเผยแพร่สู่สาธารณะ ยกเว้นข้อมูลที่ลูกค้าเผยแพร่เองหรือที่มีการตกลงร่วมกันแล้วระหว่างลูกค้าและห้องปฏิบัติการ ข้อมูลอื่น ๆ ทั้งหมด ถือเป็นข้อมูลที่มีกรรมสิทธิ์และเป็นความลับ"],["4.2.2","เมื่อกฎหมายหรือผู้ที่มีอำนาจให้ห้องปฏิบัติการเปิดเผยข้อมูลที่เป็นความลับของลูกค้า ห้องปฏิบัติการต้องแจ้งให้ลูกค้าหรือบุคคลที่เกี่ยวข้องทราบ เว้นแต่เมื่อมีกฎหมายห้ามไว้"],["4.2.3","ข้อมูลเกี่ยวกับลูกค้าที่ได้รับจากแหล่งอื่นนอกเหนือจากลูกค้า (เช่น ผู้ร้องเรียน ผู้ควบคุมกฎระเบียบ) จะเป็นความลับระหว่างลูกค้ากับห้องปฏิบัติการ ห้องปฏิบัติการต้องเก็บข้อมูลของผู้ให้ข้อมูลเป็นความลับ ไม่เปิดเผยแหล่งที่ให้ข้อมูลต่อลูกค้า เว้นแต่จะได้รับอนุญาตจากผู้ให้ข้อมูล"],["4.2.4","บุคลากร รวมถึงคณะกรรมการ ผู้รับจ้าง บุคลากรจากหน่วยงานภายนอก หรือบุคคลที่ทำงานให้กับห้องปฏิบัติการ ต้องเก็บรักษาข้อมูลที่ได้รับหรือเกิดขึ้นในระหว่างการปฏิบัติงานของห้องปฏิบัติการไว้เป็นความลับยกเว้นกรณีที่ต้องเปิดเผยตามกฎหมาย"]],"5":[["5.1","ห้องปฏิบัติการต้องเป็นนิติบุคคลหรือส่วนหนึ่งของนิติบุคคลที่รับผิดชอบต่อกิจกรรมของห้องปฏิบัติการได้ตามกฎหมาย"],["5.2","ห้องปฏิบัติการต้องระบุผู้ที่มีหน้าที่รับผิดชอบการบริหารจัดการห้องปฏิบัติการ"],["5.3","ห้องปฏิบัติการต้องกำหนดและจัดทำเอกสารระบุช่วงของกิจกรรมของห้องปฏิบัติการ และอ้างถึงความเป็นไปตามมาตรฐาน ISO/IEC 17025 สำหรับช่วงของกิจกรรมของห้องปฏิบัติการเท่านั้น"],["5.4","การดำเนินกิจกรรมของห้องปฏิบัติการ ต้องเป็นไปตามข้อกำหนดของมาตรฐาน ISO/IEC 17025 ความต้องการของลูกค้า หน่วยงานผู้มีอำนาจตามกฎหมาย และองค์การที่ให้การยอมรับ การดำเนินกิจกรรมครอบคลุมทั้งห้องปฏิบัติการถาวร และสถานปฏิบัติการนอกห้องปฏิบัติการถาวร (ห้องปฏิบัติการชั่วคราว หรือห้องปฏิบัติการเคลื่อนที่ หรือห้องปฏิบัติการของลูกค้า)"],["5.5","ห้องปฏิบัติการต้อง: ก) กำหนดโครงสร้างองค์กรและการบริหารงานของห้องปฏิบัติการ สถานะของห้องปฏิบัติการในองค์กรใหญ่ และความสัมพันธ์ระหว่างการบริหารงาน การดำเนินการทางวิชาการ และการบริการสนับสนุนต่างๆ ข) ระบุความรับผิดชอบ อำนาจหน้าที่ และความสัมพันธ์ของบุคลากรทั้งหมดที่ทำหน้าที่บริหาร ปฏิบัติการหรือทวนสอบงานที่มีผลกระทบต่อผลของกิจกรรมของห้องปฏิบัติการ ค) จัดทำเอกสารขั้นตอนการดำเนินงานตามความจำเป็น"],["5.6","ห้องปฏิบัติการต้องมีบุคลากร พร้อมอำนาจหน้าที่ และทรัพยากรที่จำเป็นในการปฏิบัติหน้าที่ รวมถึง ก) การนำไปปฏิบัติ การรักษาไว้ และการปรับปรุงระบบการบริหารงาน ข) การชี้บ่งการเบี่ยงเบนจากระบบการบริหารงานหรือจากขั้นตอนการดำเนินกิจกรรมของห้องปฏิบัติการ ค) การกำหนดการปฏิบัติเพื่อป้องกันหรือลดการเบี่ยงเบนนั้นให้น้อยลง ง) รายงานต่อผู้บริหารห้องปฏิบัติการเกี่ยวกับประสิทธิภาพของระบบการบริหาร และความจำเป็นในการปรับปรุง จ) มั่นใจในประสิทธิผลของกิจกรรมของห้องปฏิบัติการ"],["5.7","ผู้บริหารของห้องปฏิบัติการ ต้องมั่นใจว่า ก) มีการสื่อสารถึงประสิทธิผลของระบบบริหารงาน และความสำคัญของความเป็นไปตามความต้องการของลูกค้า และข้อกำหนดอื่นๆ ข) ระบบการบริหารงานยังคงความสมบูรณ์ไว้ได้ เมื่อมีการเปลี่ยนแปลงระบบการบริหารงานซึ่งได้มีการวางแผนและนำไปปฏิบัติแล้ว"]],"6.1":[["6.1","ทั่วไป ห้องปฏิบัติการต้องจัดให้มีทั้งบุคลากร สิ่งอำนวยความสะดวก เครื่องมือ ระบบต่างๆ และการบริการสนับสนุนที่จำเป็นในการบริหารงานและการดำเนินกิจกรรมของห้องปฏิบัติการ"]],"6.2":[["6.2.1","บุคลากรทั้งหมดของห้องปฏิบัติการ (ทั้งภายในและภายนอก) ที่อาจมีอิทธิพลต่อกิจกรรมของห้องปฏิบัติการ ต้องมีความเป็นกลาง มีความสามารถในการปฏิบัติงานตามที่กำหนดไว้ในระบบบริหารงานของห้องปฏิบัติการ"],["6.2.2","ห้องปฏิบัติการต้องจัดทำเอกสาร ข้อกำหนดด้านความสามารถของแต่ละตำแหน่งงานที่มีผลกระทบต่อผลของกิจกรรมของห้องปฏิบัติการ ซึ่งประกอบด้วยข้อกำหนดด้านการศึกษา คุณสมบัติ การฝึกอบรม ความรู้ทางวิชาการ ทักษะและประสบการณ์"],["6.2.3","ห้องปฏิบัติการต้องมั่นใจว่าบุคลากรมีความสามารถในการดำเนินกิจกรรมของห้องปฏิบัติการ ปฏิบัติงานที่รับผิดชอบ และมีความสามารถในการประเมินนัยสำคัญของความเบี่ยงเบน"],["6.2.4","ผู้บริหารของห้องปฏิบัติการต้องสื่อสารให้บุคลากรทราบถึงหน้าที่ ความรับผิดชอบ และอำนาจ ของแต่ละคน"],["6.2.5","ห้องปฏิบัติการต้องมีขั้นตอนการดำเนินงานและจัดเก็บบันทึกเกี่ยวกับ ก) การกำหนดข้อกำหนดความสามารถ ข) การคัดเลือกบุคลากร ค) การฝึกอบรมบุคลากร ง) การควบคุมงาน จ) การมอบหมายอำนาจหน้าที่ ฉ) การเฝ้าระวังความสามารถบุคลากร"],["6.2.6","ห้องปฏิบัติการต้องมอบหมายให้บุคลากรดำเนิน กิจกรรมของห้องปฏิบัติการเฉพาะ ดังนี้ ก) การพัฒนา ดัดแปลง ทวนสอบ และการตรวจสอบความใช้ได้ของวิธี ข) การวิเคราะห์ผลการทดสอบรวมถึงการระบุความเป็นไปตามข้อกำหนด หรือการแสดงข้อคิดเห็นและการแปลผล ค) การรายงานผล การทบทวนและการอนุมัติผลการทดสอบ"]],"6.3":[["6.3.1","สิ่งอำนวยความสะดวกและภาวะแวดล้อมต้องเหมาะสมกับกิจกรรมของห้องปฏิบัติการและไม่ส่งผลกระทบต่อความถูกต้องของผลการทดสอบ"],["6.3.2","ห้องปฏิบัติการต้องจัดทำเอกสารเกี่ยวกับข้อกำหนดด้านสิ่งอำนวยความสะดวกและภาวะแวดล้อมที่จำเป็นสำหรับการดำเนินกิจกรรมของห้องปฏิบัติการ"],["6.3.3","ห้องปฏิบัติการต้องเฝ้าระวัง ควบคุมและบันทึกภาวะแวดล้อมตามเกณฑ์กำหนด วิธีการหรือขั้นตอนการดำเนินงาน หรือกรณีที่ภาวะแวดล้อมนั้นมีผลกระทบต่อความใช้ได้ของผลการทดสอบ"],["6.3.4","มาตรการเพื่อควบคุมสิ่งอำนวยความสะดวกต่างๆ ต้องนำไปปฏิบัติ เฝ้าระวังและทบทวนเป็นระยะๆ ซึ่งรวมถึง ก) การเข้าออก และการใช้พื้นที่ที่มีผลกระทบต่อกิจกรรมของห้องปฏิบัติการ ข) การป้องกันการปนเปื้อน สิ่งรบกวน หรือสิ่งที่มีผลต่อความเสียหายต่อกิจกรรมของห้องปฏิบัติการ ค) การแบ่งพื้นที่อย่างมีประสิทธิผล เมื่อมีกิจกรรมของห้องปฏิบัติการที่เข้ากันไม่ได้"],["6.3.5","เมื่อมีการดำเนินกิจกรรมของห้องปฏิบัติการ นอก สถานที่ หรือใช้สิ่งอำนวยความสะดวกที่นอกเหนือการควบคุมแบบถาวร ต้องมั่นใจว่าเป็นไปตามข้อกำหนดของสิ่งอำนวยความสะดวกและภาวะแวดล้อมตามที่กำหนดไว้"]],"6.4":[["6.4.1","ห้องปฏิบัติการต้องสามารถเข้าถึงเครื่องมือที่จำเป็น (ได้แก่ เครื่องมือวัด ซอฟต์แวร์ มาตรฐานที่ใช้สำหรับการวัด วัสดุอ้างอิง ข้อมูลอ้างอิง สารละลาย วัสดุสิ้นเปลือง อุปกรณ์ประกอบ เป็นต้น) ในการดำเนินกิจกรรมของห้องปฏิบัติการ ได้อย่างถูกต้องและที่อาจมีผลกระทบต่อผลการทดสอบ"],["6.4.2","เมื่อต้องใช้เครื่องมือที่อยู่นอกเหนือการควบคุมแบบถาวร ต้องมั่นใจว่าเครื่องมือนั้นเป็นไปตามข้อกำหนดของมาตรฐาน ISO/IEC 17025"],["6.4.3","ห้องปฏิบัติการต้องมีขั้นตอนการดำเนินงานในการจัดการ การเคลื่อนย้าย การเก็บรักษา การใช้และแผนการบำรุงรักษาเครื่องมือ เพื่อให้มั่นใจว่าเครื่องมือยังทำงานได้อย่างถูกต้องและป้องกันการปนเปื้อนหรือเสื่อมสภาพ"],["6.4.4","ห้องปฏิบัติการต้องทวนสอบว่าเครื่องมือเป็นไปตามเกณฑ์ที่กำหนดก่อนใช้งาน หรือก่อนนำกลับมาใช้งาน"],["6.4.5","เครื่องมือที่ใช้ในการวัดต้องให้ค่าที่แม่น และ/หรือให้ค่าความไม่แน่นอนของการวัดตามที่ต้องการ"],["6.4.6","เครื่องมือวัดต้องได้รับการสอบเทียบเมื่อ - ค่าความแม่นของการวัด หรือ ค่าความไม่แน่นอนของการวัด มีผลกระทบต่อความถูกต้องของผลการทดสอบที่รายงานและ/หรือ - ต้องใช้อ้างอิงความสอบกลับได้ทางมาตรวิทยาของผลการทดสอบที่รายงาน"],["6.4.7","ห้องปฏิบัติการต้องจัดทำโปรแกรมการสอบเทียบ ซึ่งต้องมีการทบทวนและปรับตามความจำเป็นเพื่อรักษาความเชื่อมั่นในสถานะการสอบเทียบ"],["6.4.8","เครื่องมือทั้งหมดที่ต้องสอบเทียบหรือมีระยะเวลาการใช้ตามที่กำหนดไว้ต้องติดป้าย แสดงรหัส หรือการชี้บ่งอย่างอื่น เพื่อให้ผู้ใช้งานเห็นได้ชัดเจนถึงสถานะการสอบเทียบหรือระยะเวลาที่ใช้งานได้"],["6.4.9","เครื่องมือที่ถูกใช้งานเกินกำลังหรือใช้งานผิดวิธี ที่ให้ผลที่น่าสงสัยหรือแสดงผลให้เห็นว่าบกพร่องหรือออกนอกขีดจำกัดที่กำหนด - ต้องนำเครื่องมือออกจากการใช้งานและแยกไว้เพื่อป้องกันการนำไปใช้หรือติดเครื่องหมายห้ามใช้ให้ชัดเจนจนกว่าจะสามารถใช้งานได้อย่างถูกต้อง - ห้องปฏิบัติการต้องตรวจสอบผลกระทบที่เกิดจากการบกพร่องหรือเบี่ยงเบนจากขีดจำกัดที่กำหนด และต้องดำเนินการตามขั้นตอนการทำงานที่ไม่เป็นไปตามที่กำหนด"],["6.4.10","ในกรณีที่จำเป็นต้องทำการตรวจสอบเครื่องมือระหว่างการใช้งาน (intermediate check) เพื่อให้มั่นใจในสมรรถนะของเครื่องมือ การตรวจสอบต้องดำเนินการตามขั้นตอนการดำเนินงานที่กำหนดไว้"],["6.4.11","ในกรณีที่ข้อมูลการสอบเทียบและวัสดุอ้างอิงได้รวมค่าอ้างอิงหรือค่าแก้ ห้องปฏิบัติการต้องมั่นใจว่าค่าอ้างอิงและค่าแก้ เป็นค่าที่เป็นปัจจุบันและนำไปใช้อย่างเหมาะสมตามเกณฑ์ที่กำหนด"],["6.4.12","ห้องปฏิบัติการต้องมีมาตรการที่เหมาะสม เพื่อป้องกันการปรับแต่งเครื่องมือโดยไม่ตั้งใจ"],["6.4.13","ห้องปฏิบัติการต้องจัดเก็บบันทึกเครื่องมือที่มีผลต่อกิจกรรมของห้องปฏิบัติการ โดยมีข้อมูลดังนี้ ก) การชี้บ่งเฉพาะของเครื่องมือ รวมถึง ซอฟต์แวร์ ข) ชื่อผู้ผลิต ชนิดของเครื่องมือ และหมายเลขเครื่อง หรือการชี้บ่งอื่นๆ ค) หลักฐานการทวนสอบว่าเครื่องมือเป็นไปตามเกณฑ์ที่กำหนด ง) สถานที่ตั้งปัจจุบัน จ) วันที่สอบเทียบ ผลการสอบเทียบ การปรับแต่ง เกณฑ์การยอมรับ วันที่ครบกำหนดการสอบเทียบครั้งต่อไป หรือ รอบการสอบเทียบ ฉ) เอกสารของวัสดุอ้างอิง ผล เกณฑ์การยอมรับ วันที่ที่เกี่ยวข้อง และอายุการใช้งาน ช) แผนการบำรุงรักษา และการบำรุงรักษาที่ผ่านมาจนถึงปัจจุบัน ซ) รายละเอียดของการชำรุด ความบกพร่อง การดัดแปลง หรือการซ่อมแซมเครื่องมือ"]],"6.5":[["6.5.1","ห้องปฏิบัติการต้องจัดทำและรักษาไว้ซึ่งความสอบกลับได้ทางมาตรวิทยาของผลการวัด ในรูปของเอกสารที่แสดงห่วงโซ่ที่ไม่ขาดช่วงของการสอบเทียบ ซึ่งแต่ละปัจจัยมีผลต่อค่าความไม่แน่นอนของการวัด มีการเชื่อมโยงไปยังค่าอ้างอิงที่เหมาะสม"],["6.5.2","ห้องปฏิบัติการต้องมั่นใจว่าผลการวัดสอบกลับได้ไปยังหน่วย SI"],["6.5.3","ในกรณีที่ความสอบกลับได้ทางมาตรวิทยาไปยังหน่วย SI ไม่สามารถเป็นไปได้ทางวิชาการ ห้องปฏิบัติการต้องแสดงความสอบกลับได้ทางมาตรวิทยาไปยังค่าอ้างอิงที่เหมาะสม"]],"6.6":[["6.6.1","ห้องปฏิบัติการต้องมั่นใจว่ามีการใช้ผลิตภัณฑ์และบริการจากภายนอก ที่มีผลต่อกิจกรรมของห้องปฏิบัติการ ที่เหมาะสม"],["6.6.2","ห้องปฏิบัติการต้องมีขั้นตอนการดำเนินงานและเก็บรักษาบันทึกสำหรับ ก) การกำหนด การทบทวน และการอนุมัติ สำหรับความต้องการผลิตภัณฑ์และบริการของห้องปฏิบัติการจากผู้ให้บริการภายนอก ข)กำหนดเกณฑ์การประเมิน การเลือก การเฝ้าระวังคุณภาพผลิตภัณฑ์/บริการ จากผู้ให้บริการภายนอก และการประเมินซ้ำ ค)ก่อนการใช้ผลิตภัณฑ์/บริการจากผู้ให้บริการภายนอก ห้องปฏิบัติการต้องมั่นใจว่าผลิตภัณฑ์/บริการนั้น มีคุณสมบัติเป็นไปตามเกณฑ์ที่ห้องปฏิบัติการกำหนด หรือเป็นไปตามข้อกำหนดตามมาตรฐาน ISO/IEC 17025 ที่เกี่ยวข้อง (ถ้ามี) ง)การดำเนินการที่เกี่ยวข้องตามผลการประเมิน การเฝ้าระวังคุณภาพผลิตภัณฑ์/บริการ และการประเมินผู้ให้บริการภายนอกใหม่"],["6.6.3","ห้องปฏิบัติการต้องแจ้งให้ผู้ให้บริการภายนอกทราบถึงเกณฑ์กำหนดของห้องปฏิบัติการเกี่ยวกับ ก) ผลิตภัณฑ์และบริการที่ต้องการ ข) เกณฑ์การยอมรับผลิตภัณฑ์/บริการ ค)ความสามารถ รวมถึงคุณสมบัติของบุคลากรที่ต้องการ ง)กิจกรรมที่ห้องปฏิบัติการหรือลูกค้าจะดำเนินการในสถานที่ของผู้ให้บริการภายนอก"]],"7.1":[["7.1.1","ห้องปฏิบัติการต้องมีขั้นตอนการดำเนินงานสำหรับการทบทวนคำขอ ข้อเสนอการประมูล และสัญญา โดยมั่นใจว่า ก) มีการระบุถึงข้อกำหนดต่าง ๆ จัดทำเป็นเอกสาร และเป็นที่เข้าใจกัน ข) ห้องปฏิบัติการมีขีดความสามารถ และทรัพยากร ตรงตามข้อกำหนด ค) เมื่อมีการใช้ผู้บริการจากภายนอก ต้องเป็นไปตามข้อ 6.6 และแจ้งให้ลูกค้าทราบถึงขอบข่ายที่จะดำเนินการโดยผู้บริการจากภายนอก และต้องได้รับความเห็นชอบจากลูกค้า ง) มีการเลือกวิธี หรือขั้นตอนการดำเนินงานที่เหมาะสมและตอบสนองความต้องการของลูกค้าได้"],["7.1.2","ห้องปฏิบัติต้องแจ้งให้ลูกค้าทราบ เมื่อวิธีทดสอบที่ลูกค้าเลือกใช้นั้นไม่เหมาะสมหรือไม่เป็นปัจจุบันแล้ว"],["7.1.3","ในกรณีที่ลูกค้าต้องการให้ระบุถึง ความเป็นไปตามเกณฑ์ หรือ มาตรฐาน สำหรับการทดสอบ ต้องระบุ เกณฑ์ หรือ มาตรฐาน และกฎการตัดสินใจ ให้ชัดเจน ยกเว้นมีการระบุเกณฑ์ หรือ มาตรฐานที่ต้องการ ไว้ในคำขอแล้ว โดยกฎการตัดสินใจ ที่เลือกใช้ต้องมีการสื่อสารและได้รับความเห็นชอบจากลูกค้า"],["7.1.4","ความแตกต่างใดๆ ระหว่างคำขอหรือข้อเสนอการประมูล และสัญญา ต้องได้รับการแก้ไขก่อนเริ่มงาน สัญญาแต่ละฉบับต้องเป็นที่ยอมรับจากห้องปฏิบัติการและลูกค้า การเบี่ยงเบนใดๆ ที่ลูกค้าร้องขอ ต้องไม่กระทบต่อความถูกต้องของผลการทดสอบ"],["7.1.5","ต้องแจ้งให้ลูกค้าทราบถึงการเบี่ยงเบนใดๆ ไปจากสัญญาที่ได้ตกลงกันแล้ว"],["7.1.6","ถ้ามีการแก้ไขสัญญาหลังจากเริ่มงานไปแล้ว ต้องมีการทบทวนสัญญาอีกครั้ง และการแก้ไขใดๆ ต้องสื่อสารให้บุคคลทั้งหมดที่ได้รับผลกระทบทราบ"],["7.1.7","ห้องปฏิบัติการต้องประสานงานกับลูกค้าหรือตัวแทนของลูกค้าเพื่อทำความเข้าใจในคำร้องขอของลูกค้า และเพื่อเฝ้าระวังสมรรถนะของห้องปฏิบัติการที่เกี่ยวกับงานที่ปฏิบัติ"],["7.1.8","ต้องจัดเก็บบันทึกของการทบทวน และความเบี่ยงเบนใดๆ รวมถึงข้อหารือเกี่ยวกับความต้องการของลูกค้าหรือผลการทดสอบของห้องปฏิบัติการ"]],"7.2":[["7.2.1.1","ห้องปฏิบัติการต้องใช้วิธีและขั้นตอนการดำเนินงานที่เหมาะสมสำหรับทุกกิจกรรมของห้องปฏิบัติการรวมถึงการประมาณค่าความไม่แน่นอนของการวัดและวิธีทางสถิติสำหรับการวิเคราะห์ข้อมูล"],["7.2.1.2","วิธี ขั้นตอนการดำเนินงานและเอกสารสนับสนุนเช่น คำแนะนำ มาตรฐาน คู่มือ และข้อมูลอ้างอิง ที่เกี่ยวข้องกับกิจกรรมของห้องปฏิบัติการทั้งหมด ต้องรักษาให้ทันสมัยและต้องมีพร้อมใช้งาน"],["7.2.1.3","ห้องปฏิบัติการต้องมั่นใจว่าได้ใช้มาตรฐานฉบับล่าสุด ยกเว้นกรณีที่ไม่เหมาะสมหรือไม่สามารถทำได้และหากจำเป็นอาจต้องจัดทำรายละเอียดเพิ่มเติมเพื่อให้มั่นใจในการนำไปใช้ได้ตรงกัน"],["7.2.1.4","กรณีที่ลูกค้าไม่ได้ระบุวิธีที่ใช้ ห้องปฏิบัติการต้องเลือกวิธีที่เหมาะสมและแจ้งให้ลูกค้าทราบ ซึ่งควรเลือกใช้วิธีที่ตีพิมพ์ในมาตรฐานระดับนานาชาติ ระดับภูมิภาค ระดับประเทศ องค์กรที่มีชื่อเสียงเป็นที่ยอมรับ หนังสือหรือบทความทางวิทยาศาสตร์ที่เกี่ยวข้อง ของผู้ผลิตเครื่องมือ วิธีที่ห้องปฏิบัติการพัฒนาขึ้นเองหรือการดัดแปลงจากวิธีมาตรฐานก็สามารถใช้ได้"],["7.2.1.5","ห้องปฏิบัติการต้องทวนสอบวิธีว่าสามารถดำเนินการได้ตามที่วิธีกำหนดอย่างเหมาะสม ก่อนที่จะเริ่มใช้งาน ต้องจัดเก็บบันทึกผลการทวนสอบ หากมีการออกมาตรฐานฉบับใหม่ ต้องทำการทวนสอบซ้ำตามความจำเป็น"],["7.2.1.6","กรณีที่ใช้วิธีที่พัฒนาขึ้นเอง ต้องมีการวางแผนและมอบหมายบุคลากรที่มีความสามารถพร้อมทรัพยากรที่เพียงพอ มีการทบทวนเป็นระยะเพื่อให้มั่นใจว่ายังตรงต่อความต้องการของลูกค้า การเปลี่ยนแปลงใดๆจากแผนที่ได้กำหนดไว้ต้องผ่านการอนุมัติและมอบหมายอำนาจหน้าที่"],["7.2.1.7","การเบี่ยงเบนไปจากวิธีที่กำหนด สำหรับทุกกิจกรรมของห้องปฏิบัติการ ต้องมีการพิจารณาความเหมาะสมทางวิชาการ ผ่านการอนุมัติ จัดทำไว้เป็นเอกสาร และได้รับความเห็นชอบจากลูกค้า"],["7.2.2.1","ห้องปฏิบัติการต้องตรวจสอบความใช้ได้ของวิธีที่ไม่เป็นมาตรฐาน วิธีที่พัฒนาขึ้นเอง วิธีมาตรฐานที่ใช้นอกขอบข่ายหรือการดัดแปลงวิธี มีการตรวจสอบความใช้ได้ของวิธี ที่จำเป็นตามวัตถุประสงค์การใช้งาน"],["7.2.2.2","เมื่อวิธีที่ผ่านการตรวจสอบความใช้ได้ของวิธีแล้ว มีการเปลี่ยนแปลง ต้องพิจารณาผลกระทบของการเปลี่ยนแปลง หากจำเป็นต้องทำการตรวจสอบความใช้ได้ของวิธีใหม่"],["7.2.2.3","คุณลักษณะของวิธี (Performance characteristics) ของการตรวจสอบความใช้ได้ของวิธี ควรสอดคล้องกับความต้องการของลูกค้าและข้อกำหนดเฉพาะ"],["7.2.2.4","ห้องปฏิบัติการต้องจัดเก็บบันทึกของการตรวจสอบความใช้ได้ของวิธี ได้แก่ ก. ขั้นตอนการตรวจสอบความใช้ได้ของวิธี ข. ระบุเกณฑ์ที่ใช้ ค. กำหนดคุณลักษณะเฉพาะของวิธี ง. ผลการตรวจสอบ จ. ข้อความระบุถึงความใช้ได้ของวิธี มีรายละเอียดเพื่อยืนยันว่าวิธีนั้นเหมาะสมกับการใช้ตามวัตถุประสงค์"]],"7.3":[["7.3.1","ห้องปฏิบัติการต้องมีแผนและวิธีการชักตัวอย่างเมื่อทำการชักตัวอย่างสาร วัสดุ หรือผลิตภัณฑ์เพื่อทำการทดสอบ วิธีการชักตัวอย่างต้องระบุปัจจัยที่ต้องควบคุมเพื่อให้มั่นใจในความใช้ได้ของผลทดสอบ ทั้งนี้ แผนและวิธีการชักตัวอย่างต้องมีอยู่ ณ สถานที่ชักตัวอย่าง แผนการชักตัวอย่าง ต้องอยู่บนพื้นฐานวิธีการทางสถิติที่เหมาะสม"],["7.3.2","วิธีการชักตัวอย่าง ต้องอธิบายถึง ก. การเลือกตัวอย่าง หรือสถานที่ ข. แผนการชักตัวอย่าง ค. การเตรียมตัวอย่างจากตัวอย่างสาร วัสดุ หรือผลิตภัณฑ์เพื่อให้ได้ตัวอย่างตามที่ต้องการสำหรับการทดสอบ"],["7.3.3","ห้องปฏิบัติการต้องจัดเก็บบันทึกข้อมูลการชักตัวอย่าง ที่เป็นส่วนหนึ่งของบันทึกการทดสอบที่ปฏิบัติ บันทึกต้องครอบคลุมถึงรายละเอียด ดังนี้ วิธีการชักตัวอย่าง วันที่และเวลาการชักตัวอย่าง ข้อมูลเพื่อชี้บ่งและลักษณะของตัวอย่าง ผู้ชักตัวอย่าง เครื่องมือที่ใช้ ภาวะแวดล้อมและภาวะการขนส่ง ผังแสดงตำแหน่งของการชักตัวอย่าง และสิ่งที่เบี่ยงเบนเพิ่มเติมหรือยกเลิกจากวิธีและแผนการชักตัวอย่าง"]],"7.4":[["7.4.1","ห้องปฏิบัติการต้องมีขั้นตอนการดำเนินงานในการขนส่ง การรับ การจัดการ การป้องกัน การจัดเก็บตามระยะเวลาที่กำหนด และการทำลายหรือส่งคืนตัวอย่าง รวมถึงการจัดให้มีสิ่งที่จำเป็นทั้งหมดในการรักษาความสมบูรณ์ของตัวอย่างและการปกป้องผลประโยชน์ของห้องปฏิบัติการและลูกค้า มีการเตือนหรือหลีกเลี่ยงการเสื่อมสภาพ การปนเปื้อน การสูญหายหรือความเสียหายที่อาจเกิดกับตัวอย่างระหว่างการจัดการ การขนส่ง การเก็บ การรอ และการเตรียมตัวอย่างสำหรับการทดสอบ ห้องปฏิบัติการจะต้องปฏิบัติตามคำแนะนำในการจัดการตัวอย่างที่มาพร้อมกับตัวอย่าง"],["7.4.2","ห้องปฏิบัติการต้องมีระบบการชี้บ่งตัวอย่างที่ชัดเจน การชี้บ่งต้องคงอยู่ตลอดเวลาที่ตัวอย่างอยู่ภายใต้ความรับผิดชอบของห้องปฏิบัติการ ระบบชี้บ่งต้องทำให้มั่นใจได้ว่าจะไม่เกิดความสับสนทางกายภาพ หรือเมื่ออ้างอิงในบันทึกหรือเอกสารอื่นๆ ระบบต้องรวมถึงการแบ่งส่วนย่อยของตัวอย่างหรือกลุ่มตัวอย่างและการขนย้ายตัวอย่าง"],["7.4.3","หากตัวอย่างที่ได้รับมีลักษณะที่แตกต่างจากที่กำหนดไว้ ห้องปฏิบัติการต้องบันทึกความแตกต่างดังกล่าว ในกรณีที่มีความสงสัยถึงความเหมาะสมของตัวอย่าง หรือกรณีที่ตัวอย่างไม่เป็นไปตามรายละเอียดที่กำหนดไว้ ห้องปฏิบัติการต้องหารือกับลูกค้าเพื่อหาข้อตกลงก่อนดำเนินการต่อไป และต้องบันทึกรายละเอียดการหารือดังกล่าวไว้ เมื่อลูกค้าต้องการให้ทดสอบตัวอย่างที่มีลักษณะแตกต่างไปจากที่กำหนดไว้ ห้องปฏิบัติการต้องแสดงข้อความเพื่อชี้บ่งว่าความแตกต่างนั้นอาจมีผลกระทบต่อผลที่ได้"],["7.4.4","กรณีที่ต้องมีการเก็บรักษาตัวอย่าง หรือมีการปรับภาวะ ตามภาวะแวดล้อมที่กำหนด ต้องมีการรักษา เฝ้าระวัง และบันทึก"]],"7.5":[["7.5.1","ห้องปฏิบัติการต้องมั่นใจว่าบันทึกทางวิชาการของแต่ละกิจกรรมของห้องปฏิบัติการ ซึ่งประกอบด้วยผล รายงาน และข้อมูลที่เพียงพอ ถ้าเป็นไปได้ให้ชี้บ่งปัจจัยต่างๆ ที่มีผลต่อผลการวัดและค่าความไม่แน่นอนของการวัด เพื่อให้สามารถทำกิจกรรมซ้ำได้ภายใต้ภาวะที่ใกล้เคียงกับครั้งแรก บันทึกต่างๆ ต้องลงวันที่ และระบุผู้รับผิดชอบในแต่ละกิจกรรมของห้องปฏิบัติการและผู้ตรวจสอบข้อมูลและผลของกิจกรรมนั้น ข้อสังเกต ข้อมูลและการคำนวณต่างๆ ต้องทำการบันทึกขณะดำเนินการ และต้องชี้บ่งได้ว่าเป็นงานใด"],["7.5.2","ห้องปฏิบัติการต้องมั่นใจว่าการเปลี่ยนแปลงแก้ไขบันทึกทางวิชาการสามารถสอบกลับถึงข้อมูลก่อนหน้าหรือข้อมูลตั้งต้นได้ ต้องเก็บรักษาข้อมูลและบันทึกทั้งฉบับตั้งต้นและฉบับที่เปลี่ยนแปลงแก้ไข รวมถึงวันที่แก้ไข สิ่งที่แก้ไข และผู้รับผิดชอบสำหรับการแก้ไข"]],"7.6":[["7.6.1","ห้องปฏิบัติการต้องระบุปัจจัยที่ส่งผลต่อความไม่แน่นอนของการวัด ในการประเมินค่าความไม่แน่นอนของการวัด ต้องพิจารณาองค์ประกอบที่สำคัญทั้งหมด รวมทั้งที่เกิดจากการชักตัวอย่าง โดยใช้วิธีการวิเคราะห์ที่เหมาะสม"],["7.6.2","ห้องปฏิบัติการที่ดำเนินการสอบเทียบ รวมถึงการสอบเทียบเครื่องมือของห้องปฏิบัติการเอง ต้องมีการประเมินค่าความไม่แน่นอนของการวัดสำหรับทุกการสอบเทียบ"],["7.6.3","ห้องปฏิบัติการที่ดำเนินการทดสอบต้องมีการประเมินค่าความไม่แน่นอนของการวัด ในกรณีที่วิธีทดสอบไม่สามารถทำการประเมินค่าความไม่แน่นอนของการวัดได้ ต้องทำการประมาณค่าความไม่แน่นอนของการวัดบนพื้นฐานความเข้าใจของหลักการทางทฤษฎีหรือจากประสบการณ์ในทางปฏิบัติ"]],"7.7":[["7.7.1","ห้องปฏิบัติการต้องมีขั้นตอนการดำเนินงานเพื่อเฝ้าระวังความใช้ได้ของผล ต้องบันทึกข้อมูลไว้ในลักษณะที่แสดงถึงแนวโน้ม และถ้าทำได้ให้ใช้วิธีการทางสถิติในการทบทวนผล การเฝ้าระวังต้องมีการวางแผนและทบทวนด้วยวิธีที่เหมาะสม"],["7.7.2","ถ้าเป็นไปได้และเหมาะสมห้องปฏิบัติการต้องเฝ้าระวังการปฏิบัติงานโดยการเปรียบเทียบผลกับห้องปฏิบัติการอื่น การเฝ้าระวังนี้ต้องมีการวางแผนและทบทวน โดยการเข้าร่วมกิจกรรมการทดสอบความชำนาญห้องปฏิบัติการ และ/หรือการเปรียบเทียบระหว่างห้องปฏิบัติการ"],["7.7.3","ต้องมีการวิเคราะห์ข้อมูลจากกิจกรรมเฝ้าระวัง และถ้าทำได้ต้องใช้ข้อมูลนี้เพื่อการควบคุมและปรับปรุงกิจกรรมของห้องปฏิบัติการ และเมื่อพบว่าค่าที่วิเคราะห์ได้อยู่นอกเกณฑ์ควบคุมที่กำหนดไว้ ต้องมีการดำเนินการที่เหมาะสมเพื่อป้องกันไม่ให้มีการรายงานผลที่ไม่ถูกต้อง"]],"7.8":[["7.8.1.1","ผลการทดสอบ ต้องได้รับการทบทวนและอนุมัติก่อนออกรายงาน"],["7.8.1.2","การรายงานผลต้องถูกต้อง ชัดเจน ไม่คลุมเครือ และตรงตามวัตถุประสงค์ ต้องรวมถึงข้อมูลทั้งหมดที่ตกลงกับลูกค้า ข้อมูลที่จำเป็นสำหรับการแปลผล และข้อมูลทั้งหมดที่กำหนดไว้ในวิธีที่ใช้ โดยห้องปฏิบัติการต้องเก็บรักษารายงานทุกฉบับไว้เป็นส่วนหนึ่งของบันทึกด้านวิชาการ"],["7.8.1.3","กรณีที่ตกลงกับลูกค้าแล้ว การรายงานผลอาจทำแบบง่ายได้ โดยข้อมูลที่ระบุไว้ในข้อ 7.8.2 ถึง 7.8.7 ซึ่งไม่ได้รายงานให้ลูกค้า จะต้องมีพร้อมไว้"],["7.8.2.1","รายงานแต่ละฉบับต้องประกอบด้วยข้อมูลตามISO/IEC 17025 ข้อ7.8.2.1 (a) ถึง (p) เป็นอย่างน้อย ยกเว้นกรณีที่ห้องปฏิบัติการมีเหตุผลสมควรที่จะไม่รายงานข้อมูลนั้นๆ และต้องไม่ทำให้เกิดความเข้าใจผิดหรือใช้งานที่ผิด"],["7.8.2.2","ห้องปฏิบัติการต้องรับผิดชอบต่อข้อมูลทั้งหมดในรายงาน ยกเว้นข้อมูลที่ได้มาจากลูกค้าซึ่งต้องชี้บ่งให้ชัดเจน ต้องมีการระบุข้อความเมื่อข้อมูลที่ได้จากลูกค้าอาจมีผลกระทบต่อความถูกต้องของผลการทดสอบ กรณีที่ห้องปฏิบัติการไม่ได้รับผิดชอบในการชักตัวอย่าง ต้องระบุในรายงานให้ชัดเจนถึงผลการทดสอบที่เป็นไปตามตัวอย่างที่ได้รับ"],["7.8.3.1","นอกจากข้อมูลในข้อ 7.8.2 กรณีที่จำเป็นต่อการ แปลผล รายงานผลการทดสอบต้องรวมถึงข้อมูลในISO/IEC 17025 ข้อ 7.8.3.1 (a) ถึง (e)"],["7.8.3.2","กรณีที่ห้องปฏิบัติการรับผิดชอบในการชักตัวอย่าง การรายงานผลต้องเป็นไปตามที่กำหนดในข้อ 7.8.5 ในกรณีที่การชักตัวอย่างมีผลต่อการแปลผล"],["7.8.5.1","7.8.5 ข้อกำหนดเฉพาะสำหรับการรายงานผลการชักตัวอย่าง กรณีที่ห้องปฏิบัติการทำการชักตัวอย่าง นอกจากที่กำหนดในข้อ 7.8.2 รายงานผลต้องรวมถึงข้อมูลในISO/IEC 17025 ข้อ 7.8.5 (a) ถึง (f) ในกรณีที่การชักตัวอย่างมีผลต่อการแปลผล"],["7.8.6.1","กรณีที่มีการระบุข้อความที่แสดงว่าตัวอย่างมีสมบัติเป็นไปตามข้อกำหนด ห้องปฏิบัติการต้องจัดทำเอกสาร แสดงเกณฑ์การตัดสินที่ใช้ โดยต้องคำนึงถึงระดับความเสี่ยง เช่น ผลเท็จในการยอมรับ ผลเท็จในการปฏิเสธ และสมมติฐานทางสถิติ ในการใช้เกณฑ์การตัดสินใจ"],["7.8.6.2","ห้องปฏิบัติการต้องรายงานความสอดคล้อง โดยต้องระบุให้ชัดเจนถึงผลของความสอดคล้องตามเกณฑ์ ระบุเกณฑ์หรือมาตรฐาน และเกณฑ์การตัดสินใจที่ใช้"],["7.8.7.1","กรณีที่มีการแสดงข้อคิดเห็นและแปลผลห้องปฏิบัติการต้องมั่นใจว่าบุคลากรที่มีอำนาจหน้าที่เท่านั้นที่จะแสดงข้อคิดเห็นและแปลผล ห้องปฏิบัติการต้องจัดทำเอกสารที่ใช้เป็นพื้นฐานในการแสดงข้อคิดเห็นและแปลผล"],["7.8.7.2","การแสดงข้อคิดเห็นและแปลผลต้องอยู่บนพื้นฐาน ผลที่ได้จากการทดสอบตัวอย่างนั้นๆ และต้องมีการชี้บ่งอย่างชัดเจน"],["7.8.7.3","เมื่อมีการแสดงข้อคิดเห็นและแปลผลโดยตรงไปยังลูกค้าผ่านทางการสนทนา ต้องมีการเก็บรักษาบันทึกการสนทนานั้นไว้"],["7.8.8.1","กรณีที่รายงานผลที่ออกไปแล้วต้องทำการเปลี่ยนแปลง แก้ไข หรือออกใหม่ ต้องระบุให้ชัดเจนถึงข้อมูลที่ได้เปลี่ยนแปลง และระบุเหตุผลของการแก้ไข ตามความเหมาะสม"],["7.8.8.2","การแก้ไขรายงานที่ออกไปแล้ว ต้องทำในรูปแบบการออกเอกสารเพิ่มเติมหรือการถ่ายโอนข้อมูล และต้องระบุข้อความที่แสดงว่าเป็นรายงานเพื่อแก้ไขรายงานฉบับเดิมที่ได้ออกไปแล้ว (ระบุหมายเลขรายงานฉบับเดิม) การแก้ไขรายงานต้องเป็นไปตามข้อกำหนดตามมาตรฐาน ISO/IEC 17025"],["7.8.8.3","กรณีที่จำเป็นต้องออกรายงานใหม่ทั้งฉบับ ต้องมีการชี้บ่งเฉพาะและอ้างอิงถึงรายงานฉบับเดิมที่ออกทดแทน"]],"7.9":[["7.9.1","ห้องปฏิบัติการต้องมีเอกสารขั้นตอนดำเนินการในการรับ การประเมิน และการตัดสินข้อร้องเรียน"],["7.9.2","รายละเอียดของขั้นตอนการจัดการข้อร้องเรียนต้องมีพร้อมให้ผู้ที่เกี่ยวข้องในการร้องขอ และเมื่อได้รับข้อร้องเรียน ห้องปฏิบัติการต้องมีการยืนยันว่าเรื่องที่ร้องเรียนเกี่ยวข้องกับกิจกรรมของห้องปฏิบัติการหรือไม่ และถ้าใช่ ต้องมีการจัดการกับข้อร้องเรียนนั้น ห้องปฏิบัติการต้องรับผิดชอบต่อการตัดสินใจทั้งหมดในทุกระดับของทุกขั้นตอนการจัดการข้อร้องเรียน"],["7.9.3","ขั้นตอนการจัดการข้อร้องเรียนอย่างน้อยต้องประกอบด้วย การอธิบายขั้นตอนการรับ การทวนสอบ การสอบสวน ข้อร้องเรียน การตัดสินใจในการจัดการ ต้องมีการบันทึกและสอบย้อนกลับได้และมั่นใจว่ามีการจัดการที่เหมาะสม"],["7.9.4","เมื่อได้รับข้อร้องเรียนห้องปฏิบัติการต้องทำการรวบรวมและทวนสอบข้อมูลทั้งหมดที่จำเป็นต่อการตรวจสอบข้อร้องเรียนนั้น"],["7.9.5","หากเป็นไปได้ ห้องปฏิบัติการต้องมีการยืนยันว่าได้รับข้อร้องเรียน มีการรายงานความก้าวหน้า และผลการจัดการข้อร้องเรียนให้ผู้ร้องเรียนทราบ"],["7.9.6","ผลการจัดการข้อร้องเรียนที่สื่อสารไปยังผู้ร้องเรียน ต้องจัดทำหรือทบทวน และ อนุมัติ โดยบุคคล ที่ไม่มีส่วนเกี่ยวข้องกับกิจกรรมที่ได้รับการร้องเรียน"],["7.9.7","ถ้าเป็นไปได้ ต้องแจ้งผลให้ผู้ร้องเรียนทราบอย่างเป็นทางการ"]],"7.10":[["7.10.1","ห้องปฏิบัติการต้องมีขั้นตอนการดำเนินงานที่ต้องนำไปปฏิบัติ เมื่องานหรือผลของงานนั้นไม่เป็นไปตามขั้นตอนการดำเนินงานหรือที่ตกลงไว้กับลูกค้าโดยให้มั่นใจถึงความรับผิดชอบและมอบหมายในการจัดการงานที่ไม่เป็นไปตามที่กำหนด การจัดการ (รวมถึงการหยุดหรือทำงานซ้ำ หรือระงับการออกรายงาน) ตามระดับความเสี่ยง การประเมินความสำคัญ ผลกระทบต่อผลการทดสอบ การตัดสินใจในการยอมรับงานที่ไม่เป็นไปตามที่กำหนด ความจำเป็นในการแจ้งลูกค้าและเรียกรายงานคืน รวมทั้งที่มอบหมายผู้รับผิดชอบในการจัดการ"],["7.10.2","ต้องเก็บรักษาบันทึกของงานที่ไม่เป็นไปตามที่กำหนดและกิจกรรมที่ทำ ตามที่ระบุไว้ในข้อ 7.10.1 (b) ถึง (f)"],["7.10.3","กรณีการประเมินบ่งชี้ว่างานที่ไม่เป็นไปตามที่กำหนดอาจเกิดซ้ำอีก หรือมีข้อสงสัยเกี่ยวกับการปฏิบัติงานตามระบบของห้องปฏิบัติการ ต้องดำเนินการปฏิบัติการแก้ไข (corrective action)"]],"7.11":[["7.11.1","ห้องปฏิบัติการต้องสามารถเข้าถึงข้อมูลและสารสนเทศที่จำเป็นต่อการดำเนินกิจกรรมของห้องปฏิบัติการ"],["7.11.2","ระบบการจัดการสารสนเทศของห้องปฏิบัติการ (Laboratory information management system) ที่ใช้สำหรับรวบรวม ประมวลผล บันทึก รายงานผล เก็บรักษา หรือเรียกข้อมูลกลับมาใช้ ต้องผ่านการตรวจสอบความใช้ได้ของการทำงาน รวมถึงการทำงานเชื่อมต่ออย่างเหมาะสมกับระบบการจัดการสารสนเทศของห้องปฏิบัติการก่อนนำมาใช้งาน เมื่อมีการเปลี่ยนแปลงใดๆ ซึ่งรวมทั้ง laboratory software configuration หรือการดัดแปลงโปรแกรมสำเร็จรูปที่มีขายตามท้องตลาด ต้องได้รับการอนุมัติ จัดทำเป็นเอกสาร และผ่านการตรวจสอบความใช้ได้ก่อนนำมาใช้งาน"],["7.11.3","ระบบการจัดการสารสนเทศของห้องปฏิบัติการที่ใช้ต้อง ก. มีการป้องกันการเข้าถึงจากผู้ที่ไม่ได้รับมอบหมาย ข. มีระบบป้องกันการปลอมแปลงและการสูญหาย ค. มีการใช้งานในภาวะแวดล้อมตามที่ผู้จัดทำโปรแกรมหรือห้องปฏิบัติการระบุไว้ หรือในกรณีไม่ใช้ระบบคอมพิวเตอร์ ต้องกำหนดเงื่อนไขการทำงานให้การบันทึกและการถ่ายโอนด้วยมือมีความถูกต้อง ง. มีการดูแลรักษาเพื่อให้มั่นใจว่าข้อมูลและสารสนเทศมีความสมบูรณ์ จ. มีการบันทึกระบบที่ทำงานบกพร่อง และปฏิบัติการแก้ไขอย่างเหมาะสมทันที"],["7.11.4","กรณีที่ระบบการจัดการสารสนเทศของห้องปฏิบัติการได้รับการจัดการและบำรุงรักษานอกที่ตั้ง หรือโดยผู้ให้บริการภายนอก ต้องมั่นใจว่าผู้ให้บริการหรือผู้ปฏิบัติงานดำเนินงานสอดคล้องกับข้อกำหนดของมาตรฐาน ISO/IEC 17025"],["7.11.5","ต้องมั่นใจว่าคู่มือการใช้งานและข้อมูลอ้างอิงที่เกี่ยวข้องกับระบบการจัดการสารสนเทศของห้องปฏิบัติการ มีพร้อมใช้งานสำหรับบุคลากร"],["7.11.6","การคำนวณและการถ่ายโอนข้อมูลต้องได้รับการตรวจสอบอย่างเหมาะสมและเป็นระบบ"]],"8.1":[["8.1.1","ทั่วไป ห้องปฏิบัติการต้องจัดทำเป็นเอกสาร นำไปปฏิบัติ และรักษาไว้ซึ่งระบบการบริหารงานที่สามารถสนับสนุนและแสดงถึงการบรรลุตามข้อกำหนดของมาตรฐาน ISO/IEC 17025 อย่างต่อเนื่อง และมั่นใจในคุณภาพผลจากห้องปฏิบัติการ ทั้งนี้ เพื่อให้เป็นไปตามข้อกำหนด 4-7 ห้องปฏิบัติการต้องนำระบบการบริหารงานไปใช้ตามทางเลือก A หรือ ทางเลือก B โปรดระบุทางเลือกสำหรับระบบบริหารงานของห้องปฏิบัติการ ⬜ ทางเลือก A ⬜ ทางเลือก B (ISO 9001)"],["8.1.2","ทางเลือก A ห้องปฏิบัติการจัดทำระบบการบริหารงานโดยต้องดำเนินงานต่อไปนี้เป็นอย่างน้อย - เอกสารระบบบริหารงาน (ข้อ 8.2) - การควบคุมเอกสาร (ข้อ 8.3) - การควบคุมบันทึก (ข้อ 8.4) - การจัดการความเสี่ยงและโอกาส (ข้อ 8.5) - การปรับปรุง (ข้อ 8.6) - การปฏิบัติการแก้ไข (ข้อ 8.7) - การตรวจติดตามคุณภาพภายใน (ข้อ 8.8) - การทบทวนการบริหาร (ข้อ 8.9)"],["8.1.3","ทางเลือก B ห้องปฏิบัติการที่มีการจัดทำและคงไว้ซึ่งระบบบริหารงานตามข้อกำหนดมาตรฐาน ISO 9001 และมีความสามารถดำเนินการตามข้อ 4-7 อย่างสม่ำเสมอ โดยเพิ่มเติมให้ระบบการบริหารงานเป็นไปตามข้อกำหนดข้อ 8.2 ถึง 8.9"]],"8.2":[["8.2.1","ผู้บริหารของห้องปฏิบัติการต้องจัดให้มี ทำเป็นเอกสารและรักษาไว้ซึ่งนโยบายและวัตถุประสงค์ เพื่อให้บรรลุตามจุดมุ่งหมายของมาตรฐาน ISO/IEC 17025 และต้องมั่นใจว่านโยบายและวัตถุประสงค์ เป็นที่รับทราบและนำไปใช้ในทุกระดับขององค์กร"],["8.2.2","นโยบายและวัตถุประสงค์ ต้องระบุถึงความสามารถ ความเป็นกลางและการปฏิบัติอย่างสม่ำเสมอของห้องปฏิบัติการ"],["8.2.3","ผู้บริหารของห้องปฏิบัติการต้องแสดงหลักฐานของความมุ่งมั่นในการพัฒนา และการนำระบบบริหารงานไปปฏิบัติ และมีการปรับปรุงประสิทธิผลอย่างต่อเนื่อง"],["8.2.4","มีระบบเอกสาร กระบวนการ ระบบ บันทึกที่เกี่ยวข้องกับข้อกำหนดของมาตรฐาน ISO/IEC 17025 มีการอ้างอิงถึง หรือเชื่อมโยงไปยังระบบการบริหารงาน"],["8.2.5","บุคลากรทั้งหมดที่เกี่ยวข้องกับกิจกรรมของห้องปฏิบัติการ ต้องเข้าถึงเอกสารระบบการบริหารงาน และสารสนเทศที่เกี่ยวข้องที่ใช้งานตามหน้าที่รับผิดชอบ"]],"8.3":[["8.3.1","ต้องควบคุมเอกสาร (ทั้งจากภายในและภายนอก) ที่ เกี่ยวข้องเพื่อให้เป็นไปตามมาตรฐาน ISO/IEC 17025"],["8.3.2","ห้องปฏิบัติการต้องมั่นใจว่า ก.เอกสารได้รับการอนุมัติจากผู้มีอำนาจก่อนประกาศใช้ ข.เอกสารได้รับการทบทวนเป็นระยะ และปรับให้ทันสมัยตามความจำเป็น ค.เอกสารได้รับการชี้บ่งถึงการเปลี่ยนแปลงและสถานะปัจจุบัน ง.เอกสารมีพร้อมที่จุดใช้งาน และมีการควบคุมการแจกจ่ายเอกสาร จ.เอกสารได้รับการชี้บ่งอย่างชัดเจน ฉ.มีการป้องกันการใช้เอกสารที่ล้าสมัย และต้องได้รับการชี้บ่งที่เหมาะสมถ้ายังเก็บไว้เพื่อวัตถุประสงค์ใด ๆ"]],"8.4":[["8.4.1","ห้องปฏิบัติการต้องจัดทำและรักษาบันทึกเพื่อแสดงว่าได้ดำเนินงานเป็นไปตามข้อกำหนดของมาตรฐาน ISO/IEC 17025"],["8.4.2","ห้องปฏิบัติการต้องทำการควบคุมที่จำเป็นสำหรับการชี้บ่ง การจัดเก็บ การป้องกัน สำรอง เข้าถึง กู้คืน ระยะเวลาการเก็บรักษา และจำหน่ายบันทึก ต้องจัดเก็บบันทึกภายในช่วงเวลาตามที่กำหนด การเข้าถึงบันทึกต้องเป็นไปตามการรักษาความลับ และต้องมีพร้อมการเข้าถึง"]],"8.5":[["8.5.1","ห้องปฏิบัติการต้องพิจารณาถึงความเสี่ยงและโอกาสที่เกี่ยวข้องกับกิจกรรมของห้องปฏิบัติการ"],["8.5.2","ห้องปฏิบัติการต้องวางแผนปฏิบัติการในการจัดการความเสี่ยงและโอกาส โดยมีวิธีการบูรณาการและปฏิบัติการให้เข้ากับระบบการบริหารงานและมีวิธีการประเมินประสิทธิผลของปฏิบัติการนั้น"],["8.5.3","ปฏิบัติการที่ได้ดำเนินการเพื่อจัดการความเสี่ยงและโอกาส ต้องเป็นสัดส่วนกับสิ่งที่มีผลกระทบสำคัญต่อความถูกต้องของผลการทดสอบ"]],"8.6":[["8.6.1","ห้องปฏิบัติการต้องระบุและเลือกโอกาสสำหรับการปรับปรุง และนำไปปฏิบัติใช้ตามความจำเป็น"],["8.6.2","ห้องปฏิบัติการต้องแสวงหาผลสะท้อนกลับ (feedback) ทั้งแง่บวกและแง่ลบจากลูกค้า ผลสะท้อนกลับต้องได้รับการวิเคราะห์และใช้ในการปรับปรุงระบบการบริหารงาน กิจกรรมของห้องปฏิบัติการและการบริการลูกค้า"]],"8.7":[["8.7.1","เมื่อเกิดข้อบกพร่อง ห้องปฏิบัติการต้อง ก. ดำเนินการควบคุมและแก้ไขข้อบกพร่อง และระบุผลกระทบที่เกิดขึ้น ข. ประเมินความจำเป็นในการดำเนินการใด ๆ เพื่อกำจัดสาเหตุของข้อบกพร่อง เพื่อไม่ให้เกิดซ้ำ หรือเกิดในจุดอื่น โดยทบทวนและวิเคราะห์ข้อบกพร่อง หาสาเหตุและข้อบกพร่องลักษณะคล้ายกันที่เกิดขึ้น หรืออาจเกิดขึ้น ค. ดำเนินการที่จำเป็นเพื่อแก้ไขข้อบกพร่อง ง. ทบทวนประสิทธิผลของการแก้ไข จ.ปรับข้อมูลความเสี่ยงและโอกาสที่ได้กำหนดไว้ตามแผนให้เป็นปัจจุบัน (ถ้าจำเป็น) ฉ. ปรับเปลี่ยนระบบบริหารงาน (ถ้าจำเป็น)"],["8.7.2","การปฏิบัติการแก้ไขต้องเหมาะสมกับผลกระทบที่เกิดจากข้อบกพร่อง"],["8.7.3","ห้องปฏิบัติการต้องจัดเก็บบันทึกดังนี้ ก. ลักษณะของข้อบกพร่องที่เกิด สาเหตุ สิ่งที่ได้ปฏิบัติ ข. ผลของการปฏิบัติการแก้ไข"]],"8.8":[["8.8.1","ห้องปฏิบัติการต้องดำเนินการตรวจติดตามคุณภาพภายในตามระยะเวลาที่วางแผนไว้ ให้สอดคล้องกับข้อกำหนดของระบบบริหารงาน รวมถึงกิจกรรมของห้องปฏิบัติการและข้อกำหนด ISO/IEC 17025 ซึ่งมีการนำไปปฏิบัติอย่างมีประสิทธิผลและรักษาไว้"],["8.8.2","ห้องปฏิบัติการต้อง ก. วางแผน จัดทำ นำไปปฏิบัติและรักษาไว้ซึ่งโปรแกรมการตรวจติดตามคุณภาพภายใน ซึ่งประกอบด้วยความถี่ วิธีการ หน้าที่ความรับผิดชอบ การวางแผน และการรายงานผล โดยต้องคำนึงถึง ความสำคัญของกิจกรรมของห้องปฏิบัติการ การเปลี่ยนแปลงที่มีผลกระทบต่อห้องปฏิบัติการ และผลการตรวจติดตามก่อนหน้า ข. กำหนดหลักเกณฑ์และขอบข่ายของการตรวจติดตามแต่ละครั้ง ค. มั่นใจว่ามีการรายงานผลของการตรวจติดตามให้ระดับบริหารที่เกี่ยวข้องทราบ ง. ทำการแก้ไขและปฏิบัติการแก้ไขให้แล้วเสร็จไม่ล่าช้าเกินกำหนด ฉ.จัดเก็บบันทึกหลักฐานการตรวจติดตาม ตามโปรแกรมที่กำหนด และผลของการตรวจติดตาม"]],"8.9":[["8.9.1","ผู้บริหารของห้องปฏิบัติการต้องทบทวนระบบการบริหารงานตามระยะเวลาที่กำหนด"],["8.9.2","เรื่องต่าง ๆ ที่นำเข้าสู่การทบทวนการบริหารต้องได้รับการบันทึก และต้องประกอบด้วยข้อมูลตามISO/IEC 17025 ข้อ 8.9.2 (a) ถึง (o)"],["8.9.3","ผลจากการทบทวนการบริหารงานต้องมีการบันทึก รวมถึงการตัดสินใจทั้งหมดและการปฏิบัติที่เกี่ยวข้องตามISO/IEC 17025 ข้อ 8.9.3 (a) ถึง (d)"]]};

function carComp(id){const c=S.comp.find(x=>x.id==id);if(!canCar())return fail("บทบาทนี้ออก CAR ไม่ได้");if(c.res!="ไม่ผ่าน"||!c.kind.startsWith("PT"))return fail("ออก CAR ได้เมื่อผล PT/ILC ไม่ผ่านเกณฑ์");const r=mkRec("capa",{resp_due:addDays(10),source:"อื่น ๆ",src_note:"ผลทดสอบความชำนาญ (PT/ILC) ไม่ผ่านเกณฑ์",car_type:"Minor",title:"ผลทดสอบความชำนาญไม่ผ่านเกณฑ์ – "+pn(c.pid)+" ("+c.analyte+")",clause:"6.2",description:"Repeatability RSD "+c.rsd+"% เกินเกณฑ์ ("+CRIT[c.analyte]+"%)",finder:"QM / TM"});S.trail.unshift({a:"CREATE",to:"OPEN",by:actor(),at:r.at,no:r.no,r:"จากผล PT/ILC"});c.carId=r.id;save();location.hash="#/capa/"+r.id}
function retestComp(id){if(!canQT())return fail("เฉพาะ QM / TM เพิ่มรอบประเมินซ้ำได้");const c=S.comp.find(x=>x.id==id);if(c.res!="ไม่ผ่าน"||c.kind.startsWith("PT"))return fail("ใช้กับผลเปรียบเทียบภายในที่ไม่ผ่านเกณฑ์");S.comp.push({id:"c"+uid(),pid:c.pid,analyte:c.analyte,kind:c.kind,month:Math.min(12,Math.max(1,curM()||1)),ok:true,rsd:null,res:null,carId:null,filed:null});save();msg("เพิ่มรอบประเมินซ้ำแล้ว (หลังฝึกอบรมซ้ำ)");render()}
function fileComp(id){if(!isDC())return fail("เฉพาะ DC จัดเก็บบันทึกได้");const c=S.comp.find(x=>x.id==id);if(!c.res)return fail("ต้องมีผลการประเมินก่อน");c.filed=today();save();render()}

function pAssign(){const m=hasAny(["SYSTEM_ADMIN","LABORATORY_MANAGER","QM","TM"])&&can("EDIT"),ak=hasAny(["STAFF","QM","TM","SYSTEM_ADMIN"]);return `<p class="mut">ผู้รับผิดชอบ: Lab manager / QM / TM มอบหมายงานตามความสามารถ → ผู้รับมอบหมายลงนามรับทราบ → DC จัดเก็บบันทึก · ตำแหน่ง Lab manager / QM / TM / DC ใช้หนังสือมอบหมายงานที่ HR จัดทำและ Head of RDI ลงนาม</p>

function pasteLink(e,sp){e.preventDefault();const f=new FormData(e.target);let url=String(f.get("url")||"").trim();const title=String(f.get("title")||"").trim();if(/^www\./i.test(url))url="https://"+url;if(!/^https?:\/\/[^\s]+$/i.test(url)||url.length>2000)return fail("ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https:// และไม่มีช่องว่าง");let host;try{host=new URL(url).hostname}catch(x){return fail("ลิงก์ไม่ถูกต้อง")}
const ent={id:"lnk"+uid(),name:title||host,url,link:true,size:0,type:"link",by:actor(),at:new Date().toISOString()},[t,a,b,c]=sp.split("|");let done=false;

else if(t=="pdoc"){const p=S.people.find(x=>x.id==a);if(p&&canPDoc(p)){(p.docs=p.docs||[]).push({...ent,cat:PDOC[+b]});done=true}}
else if(t=="cert"){const u=S.users.find(x=>x.id==a);if(u&&canCert(u)&&isAud(u)){(u.certs=u.certs||[]).push(ent);done=true}}
else if(t=="utrain"){const u=S.users.find(x=>x.id==a),tr=u&&(u.training||[]).find(x=>x.id==b);if(tr&&canCert(u)){(tr.files=tr.files||[]).push(ent);done=true}}

function attachSig(id,input){const u=S.users.find(x=>x.id==id),f=input.files&&input.files[0];input.value="";if(!f)return;if(!u||!canCert(u))return fail("แนบ E-ลายเซ็นได้เฉพาะเจ้าของบัญชีหรือผู้ดูแลระบบ");if(!/^image\//.test(f.type||""))return fail("E-ลายเซ็นต้องเป็นไฟล์รูปภาพ (PNG / JPG)");if(!ASSETS)return fail("การแนบไฟล์ใช้ได้เฉพาะผู้มีสิทธิ์แก้ไขของหน้านี้");upFiles([f]).then(x=>{if(x.out[0]){const old=u.sig;u.sig=x.out[0];if(old&&ASSETS.delete)ASSETS.delete(old.id).catch(()=>{});audit("USER_EDIT",u.email,"แนบ E-ลายเซ็น");save();msg("แนบ E-ลายเซ็นแล้ว – ใช้กับ E sign ครั้งต่อไป")}else msg(x.fails.join("; ")||"แนบไม่สำเร็จ",true);render()})}
